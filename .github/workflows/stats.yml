name: stats

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # STATS_TOKEN is a personal access token (repo + read:org scopes) -
      # the default GITHUB_TOKEN can only see this one repo, so it can't
      # read language/contribution data from other private or org repos.
      - run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg streak.svg langs.svg year.svg hd-*.svg
          git diff --cached --quiet || git commit -m "stats: daily update"
          git push
