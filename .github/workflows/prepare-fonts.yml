name: prepare fonts

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: pip install fonttools brotli

      - run: python3 scripts/prepare_fonts.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fonts
          git diff --cached --quiet || git commit -m "fonts: subset JetBrains Mono"
          git push
